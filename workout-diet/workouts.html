<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Plans - GymFit</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="workout-diet.css">
</head>
<body>
    <nav>
        <div class="logo">💪 GymFit</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="../member-dashboard/dashboard.html">Dashboard</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="diet.html">Diet Plans</a></li>
            <li><a href="../member-dashboard/announcements.html">Announcements</a></li>
            <li><a href="../payments/membership.html">Membership</a></li>
            <li><a href="../payments/payment.html">Payments</a></li>
        </ul>
        <div class="user-info">
            <span id="userNameDisplay">User</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container fade-in" id="app">
        <div class="workout-container">
            <div class="page-header">
                <h1>📋 Workout Plans</h1>
                <p>Choose your fitness goal and follow your personalized workout routine</p>
            </div>

            <div class="goal-selector">
                <label for="goalSelect">Select Your Fitness Goal:</label>
                <select id="goalSelect" onchange="switchWorkoutPlan(this.value)">
                    <option value="weight-loss">Weight Loss</option>
                    <option value="muscle-gain">Muscle Gain</option>
                    <option value="endurance">Endurance Training</option>
                </select>
            </div>

            <div id="workoutContent"></div>
        </div>
    </div>

    <script src="../assets/app.js"></script>
    <script src="workout.js"></script>
</body>
</html>
