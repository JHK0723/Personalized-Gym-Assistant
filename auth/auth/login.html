<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - GymFit</title>
    <link rel="stylesheet" href="../assets/global.css">
    <link rel="stylesheet" href="../member-dashboard/member-dashboard.css">
</head>
<body>
    <div id="app">
        <div class="login-container">
            <form class="login-form fade-in" id="loginForm">
                <div class="login-header">
                    <h1>💪 GymFit</h1>
                    <p>Member Login</p>
                </div>

                <div id="alertContainer"></div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>

                <div class="login-footer">
                    <p>New member? <a href="signup.html">Sign Up</a></p>
                    <p>Admin? <a href="admin-login.html">Login as Admin</a></p>
                    <p class="demo-hint">Demo: john@gym.com / password123</p>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/app.js"></script>
    <script src="login.js"></script>
</body>
</html>
